name: Build and Publish

on:
  push:
    branches: [ "trunk" ]
    tags:
      - '*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Set up Rust targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          rustup target add x86_64-pc-windows-gnu

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Download and set up macOS 26.1 SDK
        run: |
          mkdir -p .macos_sdk
          curl -L "https://github.com/joseluisq/macosx-sdks/releases/download/26.1/MacOSX26.1.sdk.tar.xz" | tar -xJ -C .macos_sdk --strip-components=1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bluez libdbus-1-dev gcc-mingw-w64-x86-64-win32

      - name: Install cargo dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin,cargo-zigbuild

      - name: Install jextract
        shell: bash
        run: |
          mkdir -p $HOME/.jextract
          curl -L "https://download.java.net/java/early_access/jextract/22/6/openjdk-22-jextract+6-47_linux-x64_bin.tar.gz" -o jextract_bundle.tar.gz
          tar -xzf jextract_bundle.tar.gz -C $HOME/.jextract --strip-components=1
          echo "$HOME/.jextract/bin" >> $GITHUB_PATH

      - name: Run build
        run: ./gradlew build -Pci=true -x test --no-daemon
        env:
          SDKROOT: ${{ github.workspace }}/.macos_sdk

      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew publishAllPublicationsToMavenCentralRepository -Pci=true -x test --no-daemon
        env:
          SDKROOT: ${{ github.workspace }}/.macos_sdk
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: btleplug4j
          path: build/libs/*.jar

