name: Build

on:
  push:
    branches: [ "trunk" ]
  release:
    types: [created]

jobs:
  build-native:
    name: Build Native (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: macos, arch: aarch64, runner: macos-14, ext: dylib, prefix: lib }
          - { os: macos, arch: x86_64, runner: macos-13, ext: dylib, prefix: lib }
          - { os: windows, arch: x86_64, runner: windows-latest, ext: dll, prefix: "" }
          - { os: linux, arch: x86_64, runner: ubuntu-latest, ext: so, prefix: lib }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Library
        working-directory: ffi
        run: cargo build --release

      - name: Prepare Artifact Directory
        shell: bash
        run: |
          mkdir -p natives/${{ matrix.target.os }}-${{ matrix.target.arch }}
          cp ffi/target/release/${{ matrix.target.prefix }}btleplug4j_ffi.${{ matrix.target.ext }} \
             natives/${{ matrix.target.os }}-${{ matrix.target.arch }}/

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: natives/

  build-java:
    name: Assemble Fat JAR
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download Native Artifacts
        uses: actions/download-artifact@v4
        with:
          path: src/main/resources/natives
          pattern: native-*
          merge-multiple: true

      - name: Verify Native Libraries Layout
        run: tree src/main/resources/natives

      - name: Build Fat JAR
        run: ./gradlew build jar -Pci=true --no-daemon

      - name: Upload Final JAR
        uses: actions/upload-artifact@v4
        with:
          name: btleplug4j
          path: build/libs/*.jar
